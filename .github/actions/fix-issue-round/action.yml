name: fix-issue-round
description: One repo:fix-issues round - fix, verify, review - reporting whether the change is clean
inputs:
  round:
    description: 'The round number; round 1 runs the fixer prompt, later rounds fix what the previous round found'
    required: true
  claude-code-oauth-token:
    description: 'OAuth token for claude-code-action'
    required: true
  github-token:
    description: 'The read-only job token for claude-code-action and its GitHub MCP server'
    required: true
  test-mnemonic:
    description: 'Test-only wallet mnemonic for the extension end-to-end specs'
    required: false
    default: ''
outputs:
  outcome:
    description: 'clean, failed or blocked'
    value: ${{ steps.end-round.outputs.outcome }}
  clean:
    description: 'true when the gate passed and the review found no blocking findings'
    value: ${{ steps.end-round.outputs.clean }}
  continue:
    description: 'true when another round should try to fix what this round found'
    value: ${{ steps.end-round.outputs.continue }}

runs:
  using: 'composite'
  steps:
    - name: fix
      uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
      env:
        EXTENSION_INTEGRATION_TEST_MNEMONIC: ${{ inputs.test-mnemonic }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        claude_args: >-
          --model opus
          --permission-mode auto
          --permission-prompts none
          --allowedTools mcp__github
        show_full_output: true
        prompt: ${{ inputs.round == '1' && 'Follow the instructions in .github/prompts/fix-issue.md.' || format('Follow the instructions in .github/prompts/fix-round.md. This is round {0}.', inputs.round) }}

    - name: begin-checks
      id: begin-checks
      shell: bash
      env:
        ROUND: ${{ inputs.round }}
      run: pnpm lt fix-issues round begin --round "$ROUND"

    - name: verify
      id: verify
      if: steps.begin-checks.outputs.state != 'blocked'
      shell: bash
      env:
        ROUND: ${{ inputs.round }}
      run: pnpm lt fix-issues round verify --round "$ROUND"

    - name: snapshot
      if: steps.verify.outputs.verified == 'true'
      shell: bash
      run: pnpm lt fix-issues round snapshot

    - name: review
      if: steps.verify.outputs.verified == 'true'
      uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github-token }}
        claude_args: >-
          --model opus
          --permission-mode auto
          --permission-prompts none
          --allowedTools mcp__github
        show_full_output: true
        prompt: Follow the instructions in .github/prompts/review-fix.md.

    - name: check-review
      if: steps.verify.outputs.verified == 'true'
      shell: bash
      env:
        ROUND: ${{ inputs.round }}
      run: pnpm lt fix-issues round check-review --round "$ROUND"

    - name: end-round
      id: end-round
      shell: bash
      env:
        ROUND: ${{ inputs.round }}
      run: pnpm lt fix-issues round end --round "$ROUND"
