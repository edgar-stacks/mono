name: repo:fix-issues
run-name: 'fix-issues: #${{ inputs.issue }}'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to fix; a grouped brief lists the others
        type: number
        required: true
      notes:
        description: The brief from the fix-issues skill, or a sentence of guidance
        type: string
        required: false
        default: ''

# GITHUB_TOKEN default permissions disabled; jobs declare their own.
permissions: {}

concurrency:
  group: fix-issues-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  fix-issue:
    name: fix-issue
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read # checkout only; this job runs the fixer and its code and never writes to the repository
      issues: read # read the issue and its comments for the fixer
      pull-requests: read # let the fixer read related pull requests through the read-only GitHub MCP server
      id-token: write # OIDC exchange for claude-code-action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'

      - name: build-packages
        run: |
          pnpm turbo run build --filter='!@leather.io/extension' --filter='!@leather.io/web' --filter='!@leather.io/test-app'
          pnpm --filter @leather.io/extension --filter @leather.io/web run prepare:build

      - name: fetch-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: pnpm lt fix-issues fetch-issue --issue "$ISSUE"

      - name: write-notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > tmp/fix-issue/notes.md

      - name: write-extension-env
        env:
          BITFLOW_API_HOST: ${{ vars.PUBLIC_BITFLOW_API_HOST }}
          BITFLOW_API_KEY: ${{ vars.PUBLIC_BITFLOW_API_KEY }}
          BITFLOW_READONLY_CALL_API_HOST: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_HOST }}
          BITFLOW_READONLY_CALL_API_KEY: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_KEY }}
          BITFLOW_KEEPER_API_KEY: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_KEY }}
          BITFLOW_KEEPER_API_HOST: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_HOST }}
          BITFLOW_PROVIDER_ADDRESS: ${{ vars.PUBLIC_BITFLOW_PROVIDER_ADDRESS }}
          LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_EXTENSION_LAUNCH_DARKLY_KEY }}
        run: |
          for key in BITFLOW_API_HOST BITFLOW_API_KEY BITFLOW_READONLY_CALL_API_HOST BITFLOW_READONLY_CALL_API_KEY \
            BITFLOW_KEEPER_API_KEY BITFLOW_KEEPER_API_HOST BITFLOW_PROVIDER_ADDRESS LAUNCH_DARKLY_KEY; do
            printf '%s=%s\n' "$key" "${!key}"
          done > apps/extension/.env

      - name: get-installed-playwright-version
        working-directory: apps/extension
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_ENV"

      - name: restore-playwright-binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cache-1-${{ env.PLAYWRIGHT_VERSION }}

      - name: install-playwright-browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/extension
        run: pnpm playwright install chromium --no-shell --with-deps

      - name: round-1
        id: round-1
        uses: $/.github/actions/fix-issue-round
        with:
          round: '1'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: round-2
        id: round-2
        if: steps.round-1.outputs.continue == 'true'
        uses: $/.github/actions/fix-issue-round
        with:
          round: '2'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: round-3
        id: round-3
        if: steps.round-2.outputs.continue == 'true'
        uses: $/.github/actions/fix-issue-round
        with:
          round: '3'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: finish-rounds
        run: pnpm lt fix-issues round finish

      - name: strip-forbidden
        run: pnpm lt fix-issues strip-forbidden

      - name: capture-screenshots
        run: pnpm lt fix-issues screenshots capture

      - name: package-fix
        run: |
          git add -A
          git diff --cached --binary --no-renames HEAD > tmp/fix-issue/fix.patch

      - name: upload-fix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-issue
          path: |
            tmp/fix-issue/status.json
            tmp/fix-issue/fix.patch
            tmp/fix-issue/rounds/
            tmp/fix-issue/screenshots/before/
            tmp/fix-issue/screenshots/after/
          if-no-files-found: error
          retention-days: 3

  open-pull-request:
    name: open-pull-request
    needs: fix-issue
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the signed fix commit on the bot/fix-<issue> branch
      pull-requests: write # open or update the issue's pull request and flip its draft state
      issues: write # comment the fixer's questions on the issue when it is blocked before changing anything
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'

      - name: build-tools
        run: pnpm --filter @leather.io/tools build

      - name: download-fix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fix-issue
          path: tmp/fix-issue

      - name: open-pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: bot/fix-${{ inputs.issue }}
          PARENT_SHA: ${{ github.sha }}
        run: >-
          pnpm lt fix-issues open-pull-request --issue "$ISSUE" --branch "$BRANCH" --base dev
          --parent-sha "$PARENT_SHA"
