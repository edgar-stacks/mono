name: repo:issue-fix
run-name: 'issue-fix: #${{ inputs.issue }}'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to fix; a grouped brief lists the others
        type: number
        required: true
      notes:
        description: The brief from the issue-fix skill, or a sentence of guidance
        type: string
        required: false
        default: ''

# GITHUB_TOKEN default permissions disabled; jobs declare their own.
permissions: {}

concurrency:
  group: issue-fix-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  issue-fix:
    name: issue-fix
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read # checkout only; this job runs the fixer and its code and never writes to the repository
      issues: read # read the issue and its comments for the fixer
      id-token: write # OIDC exchange for claude-code-action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'

      - name: build-packages
        run: |
          pnpm turbo run build --filter='!@leather.io/extension' --filter='!@leather.io/web' --filter='!@leather.io/test-app'
          pnpm --filter @leather.io/extension --filter @leather.io/web run prepare:build

      - name: fetch-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: pnpm lt issue-fix fetch-issue --issue "$ISSUE"

      - name: write-notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > tmp/issue-fix/notes.md

      - name: write-extension-env
        env:
          BITFLOW_API_HOST: ${{ vars.PUBLIC_BITFLOW_API_HOST }}
          BITFLOW_API_KEY: ${{ vars.PUBLIC_BITFLOW_API_KEY }}
          BITFLOW_READONLY_CALL_API_HOST: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_HOST }}
          BITFLOW_READONLY_CALL_API_KEY: ${{ vars.PUBLIC_BITFLOW_READONLY_CALL_API_KEY }}
          BITFLOW_KEEPER_API_KEY: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_KEY }}
          BITFLOW_KEEPER_API_HOST: ${{ vars.PUBLIC_BITFLOW_KEEPER_API_HOST }}
          BITFLOW_PROVIDER_ADDRESS: ${{ vars.PUBLIC_BITFLOW_PROVIDER_ADDRESS }}
          LAUNCH_DARKLY_KEY: ${{ vars.PUBLIC_EXTENSION_LAUNCH_DARKLY_KEY }}
        run: |
          for key in BITFLOW_API_HOST BITFLOW_API_KEY BITFLOW_READONLY_CALL_API_HOST BITFLOW_READONLY_CALL_API_KEY \
            BITFLOW_KEEPER_API_KEY BITFLOW_KEEPER_API_HOST BITFLOW_PROVIDER_ADDRESS LAUNCH_DARKLY_KEY; do
            printf '%s=%s\n' "$key" "${!key}"
          done > apps/extension/.env

      - name: get-installed-playwright-version
        working-directory: apps/extension
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> "$GITHUB_ENV"

      - name: restore-playwright-binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cache-1-${{ env.PLAYWRIGHT_VERSION }}

      - name: install-playwright-browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/extension
        run: pnpm playwright install chromium --no-shell --with-deps

      - name: round-1
        id: round-1
        uses: $/.github/actions/issue-fix-round
        with:
          round: '1'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: round-2
        id: round-2
        if: steps.round-1.outputs.continue == 'true'
        uses: $/.github/actions/issue-fix-round
        with:
          round: '2'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: round-3
        id: round-3
        if: steps.round-2.outputs.continue == 'true'
        uses: $/.github/actions/issue-fix-round
        with:
          round: '3'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
          test-mnemonic: ${{ vars.EXTENSION_INTEGRATION_TEST_MNEMONIC }}

      - name: finish-rounds
        run: pnpm lt issue-fix round finish

      - name: strip-forbidden
        run: pnpm lt issue-fix strip-forbidden

      - name: capture-screenshots
        run: pnpm lt issue-fix screenshots capture

      - name: package-fix
        run: |
          git add -A
          git diff --cached --binary --no-renames HEAD > tmp/issue-fix/fix.patch

      - name: upload-fix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-fix
          path: |
            tmp/issue-fix/status.json
            tmp/issue-fix/fix.patch
            tmp/issue-fix/rounds/
            tmp/issue-fix/screenshots/before/
            tmp/issue-fix/screenshots/after/
          if-no-files-found: error
          retention-days: 3

  open-pull-request:
    name: open-pull-request
    needs: issue-fix
    if: github.ref_name == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: issue-fix
    permissions:
      contents: read # checkout only; every GitHub write uses the issue-fix app token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/provision
        with:
          TURBO_CACHE: 'false'

      - name: build-tools
        run: pnpm --filter @leather.io/tools build

      - name: app-token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ISSUE_FIX_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_FIX_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # create the signed fix commit on bot/issue-fix-<issue>-<run id> and the screenshots on bot/screenshots-<issue>
          permission-pull-requests: write # open or update the issue's pull request and flip its draft state
          permission-issues: write # comment the fixer's questions on the issue when it is blocked before changing anything

      - name: download-fix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: issue-fix
          path: tmp/issue-fix

      - name: open-pull-request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          BRANCH: bot/issue-fix-${{ inputs.issue }}-${{ github.run_id }}
          PARENT_SHA: ${{ github.sha }}
          CO_AUTHOR: ${{ github.triggering_actor }}
        run: >-
          pnpm lt issue-fix open-pull-request --issue "$ISSUE" --branch "$BRANCH" --base dev
          --parent-sha "$PARENT_SHA" --co-author "$CO_AUTHOR"
